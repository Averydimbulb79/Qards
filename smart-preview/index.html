<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qards | Smart Qards</title><link rel="icon" href="../assets/qards-favicon.svg?v=046" type="image/svg+xml"><style>
:root{font-family:Inter,system-ui,Segoe UI,sans-serif;color:#eaf1ff;background:#0e1522}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;background:#202d42;border:1px solid #30415b;border-radius:9px;color:#eaf1ff;padding:9px 12px}button:hover{border-color:#61a9ff}.primary{background:#397df8;border-color:#397df8}header{height:66px;background:#172132;border-bottom:1px solid #30415b;display:flex;align-items:center;gap:18px;padding:0 20px}header .brand{width:146px;height:48px;object-fit:contain;object-position:left}header strong{font-size:22px;letter-spacing:-.8px}header strong span{color:#55b8f7}header small{color:#92a6c2}.spacer{flex:1}.tabs{display:flex;gap:7px;overflow:auto;padding:12px 18px;border-bottom:1px solid #30415b}.tabs button.active{background:#29578e;border-color:#428bea}.workspace{display:grid;grid-template-columns:235px minmax(0,1fr) 290px;min-height:calc(100vh - 116px)}aside{background:#141f32;padding:18px;overflow:auto;border-right:1px solid #30415b}aside.right{border-right:0;border-left:1px solid #30415b}h3{margin:0 0 14px;font-size:14px}.hint{color:#9cacc5;font-size:12px;line-height:1.6}.type{width:100%;text-align:left;margin:0 0 9px;padding:13px}.type.active{border-color:#4ba4ff;background:#223e63}.type b{display:block;font-size:13px}.type small{color:#9cb2cd}.stage{min-width:0;padding:22px;display:flex;align-items:center;flex-direction:column;gap:13px;background:#0e1522}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;max-width:1000px}.toolbar .grow{flex:1}.slide-shell{width:min(100%,1000px);aspect-ratio:16/9;background:white;box-shadow:0 24px 70px #0007;position:relative;overflow:hidden;border-radius:5px}.slide{position:absolute;inset:0;padding:6.5% 7.5%;display:flex;flex-direction:column;gap:6%;color:#1c3453}.slide h1{margin:0;font-size:clamp(15px,3vw,40px);letter-spacing:-.04em;line-height:1.1}.items{flex:1;display:grid;gap:2.2%;min-height:0}.item{min-width:0;min-height:0;background:#fff;border:1px solid #dce6f3;border-radius:11px;padding:7%;display:flex;flex-direction:column;justify-content:center;box-shadow:0 4px 12px #173c6210;overflow:hidden}.item b{font-size:clamp(9px,1.5vw,20px);color:#2468b2;overflow-wrap:anywhere}.item p{font-size:clamp(8px,1.05vw,15px);line-height:1.4;color:#455c76;overflow-wrap:anywhere}.item .num{color:#7b9fc8;font-size:11px;margin-bottom:7px}.field{display:block;font-size:12px;color:#b5c8df;margin:0 0 12px}.field input,.field textarea,.field select{display:block;margin-top:6px;width:100%;padding:10px;background:#0f1b2c;color:#eaf1ff;border:1px solid #3a4e69;border-radius:8px}.field textarea{resize:vertical;min-height:56px}.editor-item{border-top:1px solid #34435a;padding:12px 0}.editor-item .line{display:flex;justify-content:space-between;align-items:center}.editor-item .line button{padding:4px 8px}.notice{font-size:12px;color:#a9bbd3}.present{position:fixed;inset:0;background:#05080e;z-index:10;display:flex;align-items:center;justify-content:center;padding:3vw}.present .slide-shell{width:min(94vw,calc(90vh * 16 / 9))}.present .close{position:absolute;top:12px;right:12px;z-index:2}@media(max-width:1050px){.workspace{grid-template-columns:170px minmax(0,1fr)}aside.right{grid-column:1/-1;border-left:0;border-top:1px solid #30415b}.stage{padding:14px}}@media(max-width:650px){header{gap:7px;padding:0 10px}header small{display:none}.workspace{display:flex;flex-direction:column}aside{padding:12px}.types{display:flex;gap:8px;overflow:auto}.type{min-width:130px}.stage{order:1}aside.left{order:2}aside.right{order:3}.slide h1{font-size:5vw}.item b{font-size:2.2vw}.item p{font-size:1.7vw}.slide-shell{width:100%}}
button{display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .16s,border-color .16s,transform .16s}button:hover{transform:translateY(-1px)}button:focus-visible{outline:2px solid #66b3ff;outline-offset:2px}.lucide{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center}.lucide svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.editor-item .line button{min-width:31px;min-height:30px}.type{display:block}@media(max-width:650px){header .brand{width:105px}.button-label{display:none}}</style></head><body><header><img class="brand" src="../assets/qards-brand-dark.svg" alt="Qards"><small>Smart Qards · v0.5 preview</small><div class="spacer"></div><button id="save" aria-label="Export project" title="Export project"><span class="lucide" data-icon="download"></span><span class="button-label">Export</span></button><button id="load" title="Import a Qards preview project" aria-label="Import project"><span class="lucide" data-icon="folder-open"></span><span class="button-label">Import</span></button><input id="file" type="file" accept=".json,.qards" hidden></header><div class="tabs" id="categories"></div><div class="workspace"><aside class="left"><h3>Smart Qard types</h3><div class="types" id="types"></div><p class="hint">Switch types without losing your content. Layouts automatically reflow when you add or remove items.</p></aside><section class="stage"><div class="toolbar"><button id="add" class="primary" title="Add a new content item" aria-label="Add item"><span class="lucide" data-icon="plus"></span><span class="button-label">Add item</span></button><button id="remove" title="Remove the last content item" aria-label="Remove last item"><span class="lucide" data-icon="minus"></span><span class="button-label">Remove last</span></button><div class="grow"></div><button id="variant" title="Switch between grid, stacked and row layouts" aria-label="Change layout"><span class="lucide" data-icon="layout-grid"></span><span id="variantLabel">Grid</span></button><button id="present" title="Preview presentation" aria-label="Present"><span class="lucide" data-icon="play"></span><span class="button-label">Present</span></button></div><div class="slide-shell" id="shell"><div class="slide" id="slide"></div></div><p class="notice">Experimental preview · edits save locally · your existing Qards site is unchanged</p></section><aside class="right"><h3>Content & design</h3><label class="field">Slide title<input id="title"></label><label class="field">Background<select id="background"><option value="#eef3fb">Mist Blue</option><option value="#f3eee8">Warm Sand</option><option value="#e7f2ed">Sage</option><option value="#eee8f6">Lavender</option><option value="#ffffff">White</option></select></label><div id="editors"></div></aside></div><script>
const ICONS={download:'<path d="M12 3v12m-4-4 4 4 4-4"/><path d="M4 17v3h16v-3"/>','folder-open':'<path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v2"/><path d="M3 10h19l-3 10H5z"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>','layout-grid':'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',play:'<path d="m8 5 11 7-11 7z"/>','trash-2':'<path d="M3 6h18M8 6V4h8v2M5 6l1 15h12l1-15M10 10v7M14 10v7"/>'};
function paintIcons(){document.querySelectorAll('.lucide[data-icon]').forEach(el=>{el.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[el.dataset.icon]||'')+'</svg>'})}
const TYPES=[['Titles','Title & Subtitle','hero'],['Titles','Section Divider','section'],['Content','Feature Cards','cards'],['Content','Bullet List','list'],['Content','Key Takeaways','takeaways'],['Comparisons','Side-by-Side','comparison'],['Comparisons','Pros & Cons','pros'],['Processes','Linear Process','steps'],['Processes','Milestone Timeline','timeline'],['Data','KPI Dashboard','kpi'],['Data','Progress Indicators','progress'],['Strategy','Strategic Pillars','pillars']];
const KEY='qards-next-live-preview-v1',defaults={type:'cards',title:'Our Priorities',bg:'#eef3fb',variant:0,items:[{id:'a',title:'Design',body:'Create polished presentations'},{id:'b',title:'Structure',body:'Keep every idea organised'}]};let doc;try{doc={...defaults,...JSON.parse(localStorage.getItem(KEY)||'null')}}catch{doc={...defaults}}if(!Array.isArray(doc.items))doc.items=defaults.items;let category='All';const $=id=>document.getElementById(id);function persist(){localStorage.setItem(KEY,JSON.stringify(doc))}function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderCategories(){const cats=['All',...new Set(TYPES.map(t=>t[0]))];$('categories').innerHTML=cats.map(c=>'<button data-cat="'+c+'" class="'+(c===category?'active':'')+'">'+c+'</button>').join('');$('categories').querySelectorAll('button').forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderCategories();renderTypes()})}
function renderTypes(){$('types').innerHTML=TYPES.filter(t=>category==='All'||t[0]===category).map(t=>'<button class="type '+(t[2]===doc.type?'active':'')+'" data-type="'+t[2]+'"><b>'+t[1]+'</b><small>'+t[0]+'</small></button>').join('');$('types').querySelectorAll('button').forEach(b=>b.onclick=()=>{doc.type=b.dataset.type;persist();render()})}
function renderSlide(){const type=doc.type,n=doc.items.length,variant=doc.variant;let cols=variant===1?1:variant===2?n:type==='comparison'||type==='pros'?2:type==='steps'||type==='timeline'?Math.min(n,5):Math.min(n,3);cols=Math.max(1,cols);let cards=doc.items.map((it,i)=>{let body=escapeHtml(it.body),title=escapeHtml(it.title);if(type==='kpi')return '<div class="item"><b style="font-size:clamp(15px,3vw,43px)">'+title+'</b><p>'+body+'</p></div>';if(type==='progress')return '<div class="item"><b>'+title+'</b><div style="height:10px;background:#dbe7f5;border-radius:20px;margin:15px 0"><div style="width:'+Math.min(100,Math.max(0,parseFloat(it.body)||65))+'%;height:100%;background:#438be1;border-radius:20px"></div></div><p>'+body+'</p></div>';if(type==='list'||type==='takeaways')return '<div class="item"><b>✓ '+title+'</b><p>'+body+'</p></div>';return '<div class="item"><div class="num">'+String(i+1).padStart(2,'0')+'</div><b>'+title+'</b><p>'+body+'</p></div>'}).join('');if(type==='hero'||type==='section'){cards='<div style="margin:auto 0"><h1 style="font-size:clamp(24px,5vw,66px)">'+escapeHtml(doc.title)+'</h1><p style="font-size:clamp(11px,1.8vw,24px)">'+escapeHtml(doc.items[0]?.body||'')+'</p></div>';$('slide').innerHTML=cards}else{$('slide').innerHTML='<h1>'+escapeHtml(doc.title)+'</h1><div class="items" style="grid-template-columns:repeat('+cols+',minmax(0,1fr));grid-template-rows:repeat('+Math.ceil(n/cols)+',minmax(0,1fr))">'+cards+'</div>'}$('slide').style.background=doc.bg}
function renderEditors(){$('title').value=doc.title;$('background').value=doc.bg;$('editors').innerHTML=doc.items.map((it,i)=>'<div class="editor-item"><div class="line"><b>Item '+(i+1)+'</b><button data-delete="'+escapeHtml(it.id)+'" title="Remove this item" aria-label="Remove this item"><span class="lucide" data-icon="trash-2"></span></button></div><label class="field">Heading<input data-id="'+escapeHtml(it.id)+'" data-key="title" value="'+escapeHtml(it.title)+'"></label><label class="field">Description<textarea data-id="'+escapeHtml(it.id)+'" data-key="body">'+escapeHtml(it.body)+'</textarea></label></div>').join('');$('editors').querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{const item=doc.items.find(x=>x.id===el.dataset.id);if(item){item[el.dataset.key]=el.value;persist();renderSlide()}});$('editors').querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>{doc.items=doc.items.filter(x=>x.id!==el.dataset.delete);persist();render()});paintIcons()}
function render(){renderTypes();renderSlide();renderEditors();$('variantLabel').textContent=['Grid','Stack','Row'][doc.variant]}
$('add').onclick=()=>{const n=doc.items.length+1;doc.items.push({id:'item-'+Date.now(),title:'Item '+n,body:'Edit this description'});persist();render()};$('remove').onclick=()=>{doc.items.pop();persist();render()};$('variant').onclick=()=>{doc.variant=(doc.variant+1)%3;persist();render()};$('title').oninput=e=>{doc.title=e.target.value;persist();renderSlide()};$('background').onchange=e=>{doc.bg=e.target.value;persist();renderSlide()};
$('save').onclick=()=>{const blob=new Blob([JSON.stringify({format:'qards-next-preview',version:1,...doc},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='qards-preview.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('load').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed.items)||typeof parsed.title!=='string')throw Error('Not a compatible preview project');doc={...defaults,...parsed};persist();render()}catch(err){alert(err.message)}e.target.value=''};
$('present').onclick=()=>{const p=document.createElement('div');p.className='present';p.innerHTML='<button class="close">Close ✕</button><div class="slide-shell"><div class="slide">'+$('slide').innerHTML+'</div></div>';p.querySelector('.slide').style.background=doc.bg;p.querySelector('button').onclick=()=>p.remove();document.body.appendChild(p)};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.present')?.remove()});renderCategories();render();paintIcons();
</script></body></html>
