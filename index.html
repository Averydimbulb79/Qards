<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qards | Presentation Studio</title><link rel="icon" href="assets/qards-icon.svg" type="image/svg+xml">
<style>:root{font-family:Inter,system-ui,Segoe UI,sans-serif;color-scheme:dark;--bg:#0e1522;--panel:#172132;--surface:#202d42;--text:#f2f6ff;--muted:#a4b2c7;--line:#30415b;--accent:#397df8}body.light{color-scheme:light;--bg:#f3f6fb;--panel:#fff;--surface:#f1f5fb;--text:#1c273a;--muted:#718199;--line:#e1e8f2;--accent:#286cf3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px Inter,system-ui,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:10px 13px;transition:.18s}button:hover{border-color:var(--accent);transform:translateY(-1px)}button:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:700}.top{height:70px;display:flex;align-items:center;gap:16px;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--line)}.logo{width:180px;display:flex;align-items:center;flex-shrink:0}.logo img{width:145px;height:49px;object-fit:contain;object-position:left}.top input{width:min(260px,24vw);background:transparent;border:1px solid transparent;border-radius:7px;padding:9px;color:var(--text);font-weight:600}.top input:hover,.top input:focus{border-color:var(--line);outline:none}.grow{flex:1}.workspace{display:grid;grid-template-columns:78px 220px minmax(0,1fr) 270px;height:calc(100vh - 70px)}aside{background:var(--panel);overflow:auto}.rail{border-right:1px solid var(--line);padding:16px 7px;display:flex;flex-direction:column;gap:8px}.rail button{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 3px;color:var(--muted);font-size:10px}.rail button.active{background:var(--surface);color:var(--accent)}.rail .symbol{font-size:19px}.left{padding:20px 13px;border-right:1px solid var(--line)}.right{padding:24px 18px;border-left:1px solid var(--line)}.section{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:750;margin-bottom:17px}.thumb{width:100%;aspect-ratio:16/9;background:#f9fafd;color:#202739;border:2px solid transparent;border-radius:9px;padding:13px;text-align:left;margin-bottom:13px;position:relative;overflow:hidden;box-shadow:0 3px 15px #0001}.thumb.active{border-color:var(--accent);box-shadow:0 0 0 3px #397df825}.thumb span{font-size:12px;font-weight:750}.thumb small{display:block;margin-top:8px;color:#74819a;font-size:10px}.editor{min-width:0;display:flex;flex-direction:column}.toolbar{display:flex;gap:8px;align-items:center;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:64px}.toolbar button{background:transparent;border-color:transparent}.toolbar button:hover{background:var(--surface)}.stage{flex:1;display:grid;place-items:center;padding:35px;overflow:auto;background:radial-gradient(circle at 50% 40%,#6d8cc015,transparent 60%)}.slide{width:min(100%,1000px);aspect-ratio:16/9;background:#f8f9fd;color:#222b3b;border-radius:7px;box-shadow:0 25px 75px #0004;padding:8%;display:flex;flex-direction:column;justify-content:center;gap:24px;overflow:auto;position:relative}.slide:before{content:"";position:absolute;inset:0 0 auto;height:6px;background:linear-gradient(90deg,#3b87ff,#8b53fa,#ff99aa)}.slide:after{content:"Qards";position:absolute;bottom:24px;left:8%;font-weight:800;opacity:.3}.slide h1{font-size:clamp(25px,4vw,62px);line-height:1.1;letter-spacing:-.045em;margin:0;outline-offset:5px}.slide p{font-size:clamp(14px,1.8vw,27px);line-height:1.45;color:#59667d;margin:0;outline-offset:5px}.footer{padding:13px 20px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;background:var(--panel)}.field{display:block;font-size:12px;color:var(--muted);margin:22px 0}.field input,.field select{display:block;width:100%;margin-top:9px;padding:11px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px}.field input[type=color]{height:44px;padding:5px}.hint{font-size:12px;line-height:1.7;color:var(--muted)}.stack{display:grid;gap:9px}.badge{color:var(--muted);font-size:12px}.left #add{width:100%;margin-bottom:20px}@media(max-width:1100px){.workspace{grid-template-columns:65px 170px minmax(0,1fr)}.right{display:none}.stage{padding:18px}}@media(max-width:650px){.workspace{grid-template-columns:1fr}.rail,.left{display:none}.logo{width:125px}.logo img{width:120px}.top input{width:100px}.top{padding:0 10px;gap:5px}.stage{padding:10px}.toolbar{padding:8px}}.slide{display:block!important;padding:0!important;overflow:hidden!important;touch-action:none}.slide:after{display:none}.q-object{position:absolute;box-sizing:border-box;white-space:pre-wrap;overflow:hidden;line-height:1.18;cursor:move;border:1px solid transparent;user-select:none;min-width:25px;min-height:20px}.q-object.selected{border:1px solid #347fff;outline:1px solid #347fff55}.q-object .q-content{width:100%;height:100%;outline:none;overflow:hidden;cursor:text;user-select:text}.q-object .q-content:focus{outline:none}.q-handle{position:absolute;width:12px;height:12px;background:#fff;border:2px solid #347fff;border-radius:3px;right:-6px;bottom:-6px;cursor:nwse-resize;z-index:4}.inspector input[type=number],.inspector select,.inspector input[type=color]{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:7px}.inspector-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.inspector label{font-size:11px;color:var(--muted);display:grid;gap:5px}.inspector .actions{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}.inspector .actions button{padding:7px 9px}.slide.presenting .q-object{border:0!important;outline:0!important}.slide.presenting .q-handle{display:none!important}</style></head><body>
<header class="top"><div class="logo"><img id="brandLogo" src="assets/qards-dark.svg" alt="Qards"></div><input id="deckName" aria-label="Presentation name" value="Untitled presentation"><span class="badge" id="saveState">Ready</span><span class="grow"></span><button id="theme" title="Toggle light or dark theme">☀ / ☾</button><button id="present" class="primary">▷ Present</button></header>
<div class="workspace"><aside class="rail" aria-label="Navigation"><button class="active"><span class="symbol">▣</span>Slides</button><button disabled><span class="symbol">▦</span>Templates</button><button disabled><span class="symbol">◇</span>Elements</button><button disabled><span class="symbol">▧</span>Media</button><button disabled><span class="symbol">◈</span>Brand</button></aside><aside class="left"><div class="section">Your qards</div><div id="thumbs"></div><button id="add" style="width:100%">+ New qard</button></aside>
<main class="editor"><div class="toolbar"><button id="undo">↶ Undo</button><button id="redo">↷ Redo</button><button id="addText">＋ Text</button><button id="duplicate">Duplicate</button><button id="remove">Delete</button><span class="grow"></span><button id="export">Export JSON</button><button id="import">Import JSON</button><input id="file" type="file" accept="application/json,.json" hidden></div>
<div class="stage"><article class="slide" id="slide"><div id="objects"></div></article></div><div class="footer"><span id="count"></span><span>Qards Studio · v0.2.0</span></div></main>
<aside class="right"><div class="section">Qard settings</div><label class="field">Layout<select id="layout"><option value="title">Title and subtitle</option><option value="center">Centered statement</option><option value="minimal">Minimal</option></select></label><label class="field">Background colour<input type="color" id="background" value="#f8f9fd"></label><label class="field">Text colour<input type="color" id="foreground" value="#222b3b"></label><div class="section">Workspace</div><div class="stack"><button id="save">Save locally</button><button id="reset">New presentation</button></div><p class="hint">Edit text directly on the qard. Your work is automatically saved in this browser. Export JSON for a portable editable backup.</p></aside></div>
<script>(()=>{
'use strict';
const $=id=>document.getElementById(id),KEY='qards-v01',TKEY='qards-theme';
const newObj=(text,x,y,w,h,size,bold=false)=>({id:crypto.randomUUID(),text,x,y,w,h,font:'Arial',size,color:'#222b3b',bold,italic:false,align:'left'});
const slide=()=>({title:'New qard',subtitle:'Your story starts here.',layout:'title',bg:'#f8f9fd',fg:'#222b3b',objects:[newObj('New qard',10,30,80,24,52,true),newObj('Your story starts here.',10,59,80,16,25)]});
const fresh=()=>({name:'Untitled presentation',slides:[{...slide(),objects:[newObj('Ideas deserve a beautiful stage.',10,29,80,25,52,true),newObj('Click to edit. Make every qard count.',10,59,80,14,25)]}],active:0});
let doc=fresh(),selected=null,past=[],future=[],drag=null,editStart=null;
const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
function normalize(s){if(!Array.isArray(s.objects)){s.objects=[newObj(s.title||'Untitled',10,30,80,24,52,true),newObj(s.subtitle||'',10,60,80,14,25)]}s.objects=s.objects.filter(o=>o&&typeof o.text==='string').map(o=>({...newObj('',10,30,70,20,28),...o,id:String(o.id||crypto.randomUUID()),x:clamp(Number(o.x)||0,0,99),y:clamp(Number(o.y)||0,0,99),w:clamp(Number(o.w)||30,2,100),h:clamp(Number(o.h)||10,2,100),size:clamp(Number(o.size)||24,8,180)}));return s}
function valid(d){return d&&typeof d.name==='string'&&Array.isArray(d.slides)&&d.slides.length>0&&d.slides.length<=500&&d.slides.every(s=>s&&typeof s.bg==='string'&&/^#[0-9a-f]{6}$/i.test(s.bg))}
try{const s=JSON.parse(localStorage.getItem(KEY));if(valid(s))doc=s}catch(e){}
doc.slides.forEach(normalize);
function snapshot(){return JSON.stringify(doc)}
function record(){past.push(snapshot());if(past.length>80)past.shift();future=[]}
function persist(){try{localStorage.setItem(KEY,snapshot());$('saveState').textContent='Saved'}catch(e){$('saveState').textContent='Storage unavailable'}}
function change(fn){record();fn();render();persist()}
function current(){return doc.slides[doc.active]}
function activeObj(){return current().objects.find(o=>o.id===selected)}
function render(){
 doc.active=clamp(doc.active,0,doc.slides.length-1);const s=current();
 $('deckName').value=doc.name;$('slide').style.background=s.bg;$('layout').value=s.layout||'title';$('background').value=s.bg;$('foreground').value=s.fg||'#222b3b';
 $('count').textContent='Qard '+(doc.active+1)+' of '+doc.slides.length;
 $('thumbs').replaceChildren(...doc.slides.map((v,i)=>{const b=document.createElement('button');b.className='thumb'+(i===doc.active?' active':'');b.style.background=v.bg;const a=document.createElement('span'),c=document.createElement('small');a.textContent=(i+1)+'. '+(v.objects?.[0]?.text||v.title||'Untitled');c.textContent=v.objects?.[1]?.text||v.subtitle||'';b.append(a,c);b.onclick=()=>{doc.active=i;selected=null;render();persist()};return b}));
 renderObjects();renderInspector()
}
function renderObjects(){
 const area=$('objects');area.replaceChildren();area.style.cssText='position:absolute;inset:0;';
 current().objects.forEach(o=>{
 const box=document.createElement('div');box.className='q-object'+(o.id===selected?' selected':'');box.dataset.id=o.id;
 Object.assign(box.style,{left:o.x+'%',top:o.y+'%',width:o.w+'%',height:o.h+'%',fontFamily:o.font||'Arial',fontSize:(o.size||24)+'px',color:o.color||'#222b3b',fontWeight:o.bold?'700':'400',fontStyle:o.italic?'italic':'normal',textAlign:o.align||'left'});
 const content=document.createElement('div');content.className='q-content';content.contentEditable='true';content.spellcheck=true;content.textContent=o.text;
 content.addEventListener('focus',()=>{selected=o.id;editStart=snapshot();box.classList.add('selected');renderInspector()});
 content.addEventListener('input',()=>{o.text=content.innerText;persist()});
 content.addEventListener('blur',()=>{if(editStart&&snapshot()!==editStart){past.push(editStart);if(past.length>80)past.shift();future=[]}editStart=null});
 box.append(content);
 box.addEventListener('pointerdown',e=>{if(e.target===content&&document.activeElement===content)return;selected=o.id;const rect=$('slide').getBoundingClientRect();drag={id:o.id,mode:e.target.classList.contains('q-handle')?'resize':'move',startX:e.clientX,startY:e.clientY,origin:{...o},rect,before:snapshot(),moved:false};box.setPointerCapture(e.pointerId);e.preventDefault();renderInspector();area.querySelectorAll('.q-object').forEach(el=>el.classList.toggle('selected',el===box))});
 box.addEventListener('pointermove',e=>{if(!drag||drag.id!==o.id)return;const dx=(e.clientX-drag.startX)/drag.rect.width*100,dy=(e.clientY-drag.startY)/drag.rect.height*100;if(Math.abs(dx)+Math.abs(dy)>.15)drag.moved=true;if(drag.mode==='move'){o.x=clamp(drag.origin.x+dx,0,100-o.w);o.y=clamp(drag.origin.y+dy,0,100-o.h)}else{o.w=clamp(drag.origin.w+dx,3,100-o.x);o.h=clamp(drag.origin.h+dy,3,100-o.y)}box.style.left=o.x+'%';box.style.top=o.y+'%';box.style.width=o.w+'%';box.style.height=o.h+'%';});
 box.addEventListener('pointerup',()=>{if(!drag)return;if(drag.moved){past.push(drag.before);future=[];persist()}drag=null;renderInspector()});
 box.addEventListener('pointercancel',()=>{drag=null;render()});
 const handle=document.createElement('div');handle.className='q-handle';handle.title='Drag to resize';box.append(handle);area.append(box);
 });
}
function renderInspector(){
 const panel=$('objectInspector'),o=activeObj();panel.replaceChildren();
 if(!o){const p=document.createElement('p');p.className='hint';p.textContent='Select a text box to change its position, size and typography.';panel.append(p);return}
 function field(name,value,type,onchange,options){const label=document.createElement('label');label.textContent=name;const input=document.createElement(options?'select':'input');if(options){for(const item of options){const op=document.createElement('option');op.value=item;op.textContent=item;input.append(op)}}else input.type=type;input.value=value;input.addEventListener('change',()=>change(()=>{o[onchange]=type==='number'?Number(input.value):input.value}));label.append(input);return label}
 const grid=document.createElement('div');grid.className='inspector-grid';
 for(const [name,key] of [['X (%)','x'],['Y (%)','y'],['Width (%)','w'],['Height (%)','h']])grid.append(field(name,o[key],'number',key));
 panel.append(grid,field('Font family',o.font,'text','font',['Arial','Georgia','Verdana','Tahoma','Trebuchet MS','Times New Roman','Courier New']),field('Font size (px)',o.size,'number','size'),field('Text colour',o.color,'color','color'));
 const actions=document.createElement('div');actions.className='actions';
 for(const [name,key,val] of [['Bold','bold',!o.bold],['Italic','italic',!o.italic],['Left','align','left'],['Centre','align','center'],['Right','align','right']]){const b=document.createElement('button');b.textContent=name;b.onclick=()=>change(()=>o[key]=val);actions.append(b)}
 const del=document.createElement('button');del.textContent='Delete text box';del.onclick=()=>change(()=>{current().objects=current().objects.filter(x=>x.id!==o.id);selected=null});actions.append(del);panel.append(actions)
}
$('slide').addEventListener('pointerdown',e=>{if(e.target===$('slide')||e.target===$('objects')){selected=null;renderInspector();$('objects').querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'))}});
$('addText').onclick=()=>change(()=>{const o=newObj('New text box',20,25,55,16,30);current().objects.push(o);selected=o.id});
$('add').onclick=()=>change(()=>{doc.slides.splice(doc.active+1,0,slide());doc.active++;selected=null});
$('duplicate').onclick=()=>change(()=>{const copy=structuredClone(current());copy.objects.forEach(o=>o.id=crypto.randomUUID());doc.slides.splice(doc.active+1,0,copy);doc.active++;selected=null});
$('remove').onclick=()=>{if(doc.slides.length===1)return alert('A presentation needs at least one qard.');change(()=>{doc.slides.splice(doc.active,1);doc.active=clamp(doc.active,0,doc.slides.length-1);selected=null})};
$('layout').onchange=e=>change(()=>current().layout=e.target.value);
$('background').onchange=e=>change(()=>current().bg=e.target.value);
$('foreground').onchange=e=>change(()=>{current().fg=e.target.value;current().objects.forEach(o=>o.color=e.target.value)});
$('deckName').onchange=e=>change(()=>doc.name=e.target.value.trim()||'Untitled presentation');
$('undo').onclick=()=>{if(!past.length)return;future.push(snapshot());doc=JSON.parse(past.pop());selected=null;render();persist()};
$('redo').onclick=()=>{if(!future.length)return;past.push(snapshot());doc=JSON.parse(future.pop());selected=null;render();persist()};
$('save').onclick=persist;
$('reset').onclick=()=>{if(confirm('Create a new presentation? Export your current work first if needed.'))change(()=>{doc=fresh();selected=null})};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'qards',version:2,...doc},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(doc.name.replace(/[^a-z0-9-_ ]/gi,'').trim()||'presentation')+'.qards.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw Error('File too large');const data=JSON.parse(await f.text());if(!valid(data))throw Error('Invalid Qards file');change(()=>{doc={name:data.name,slides:data.slides.map(normalize),active:Number.isInteger(data.active)?data.active:0};selected=null})}catch(err){alert('Could not import: '+err.message)}e.target.value=''};
function theme(v){document.body.classList.toggle('light',v==='light');$('brandLogo').src=v==='light'?'assets/qards-light.svg':'assets/qards-dark.svg';try{localStorage.setItem(TKEY,v)}catch(e){}}
theme(localStorage.getItem(TKEY)==='light'?'light':'dark');$('theme').onclick=()=>theme(document.body.classList.contains('light')?'dark':'light');
$('present').onclick=()=>{const el=$('slide');if(document.fullscreenElement){document.exitFullscreen()}else{el.requestFullscreen?.()}};
document.addEventListener('fullscreenchange',()=>{$('slide').classList.toggle('presenting',!!document.fullscreenElement)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.target.isContentEditable){e.preventDefault();(e.shiftKey?$('redo'):$('undo')).click()}});
render();persist();
})();</script></body></html>
