<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qards | Presentation Studio</title><link rel="icon" href="assets/qards-icon.svg" type="image/svg+xml">
<style>:root{font-family:Inter,system-ui,Segoe UI,sans-serif;color-scheme:dark;--bg:#0e1522;--panel:#172132;--surface:#202d42;--text:#f2f6ff;--muted:#a4b2c7;--line:#30415b;--accent:#397df8}body.light{color-scheme:light;--bg:#f3f6fb;--panel:#fff;--surface:#f1f5fb;--text:#1c273a;--muted:#718199;--line:#e1e8f2;--accent:#286cf3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px Inter,system-ui,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:10px 13px;transition:.18s}button:hover{border-color:var(--accent);transform:translateY(-1px)}button:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:700}.top{height:70px;display:flex;align-items:center;gap:16px;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--line)}.logo{width:180px;display:flex;align-items:center;flex-shrink:0}.logo img{width:145px;height:49px;object-fit:contain;object-position:left}.top input{width:min(260px,24vw);background:transparent;border:1px solid transparent;border-radius:7px;padding:9px;color:var(--text);font-weight:600}.top input:hover,.top input:focus{border-color:var(--line);outline:none}.grow{flex:1}.workspace{display:grid;grid-template-columns:78px 220px minmax(0,1fr) 270px;height:calc(100vh - 70px)}aside{background:var(--panel);overflow:auto}.rail{border-right:1px solid var(--line);padding:16px 7px;display:flex;flex-direction:column;gap:8px}.rail button{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 3px;color:var(--muted);font-size:10px}.rail button.active{background:var(--surface);color:var(--accent)}.rail .symbol{font-size:19px}.left{padding:20px 13px;border-right:1px solid var(--line)}.right{padding:24px 18px;border-left:1px solid var(--line)}.section{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:750;margin-bottom:17px}.thumb{width:100%;aspect-ratio:16/9;background:#f9fafd;color:#202739;border:2px solid transparent;border-radius:9px;padding:13px;text-align:left;margin-bottom:13px;position:relative;overflow:hidden;box-shadow:0 3px 15px #0001}.thumb.active{border-color:var(--accent);box-shadow:0 0 0 3px #397df825}.thumb span{font-size:12px;font-weight:750}.thumb small{display:block;margin-top:8px;color:#74819a;font-size:10px}.editor{min-width:0;display:flex;flex-direction:column}.toolbar{display:flex;gap:8px;align-items:center;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:64px}.toolbar button{background:transparent;border-color:transparent}.toolbar button:hover{background:var(--surface)}.stage{flex:1;display:grid;place-items:center;padding:35px;overflow:auto;background:radial-gradient(circle at 50% 40%,#6d8cc015,transparent 60%)}.slide{width:min(100%,1000px);aspect-ratio:16/9;background:#f8f9fd;color:#222b3b;border-radius:7px;box-shadow:0 25px 75px #0004;padding:8%;display:flex;flex-direction:column;justify-content:center;gap:24px;overflow:auto;position:relative}.slide:before{content:"";position:absolute;inset:0 0 auto;height:6px;background:linear-gradient(90deg,#3b87ff,#8b53fa,#ff99aa)}.slide:after{content:"Qards";position:absolute;bottom:24px;left:8%;font-weight:800;opacity:.3}.slide h1{font-size:clamp(25px,4vw,62px);line-height:1.1;letter-spacing:-.045em;margin:0;outline-offset:5px}.slide p{font-size:clamp(14px,1.8vw,27px);line-height:1.45;color:#59667d;margin:0;outline-offset:5px}.footer{padding:13px 20px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;background:var(--panel)}.field{display:block;font-size:12px;color:var(--muted);margin:22px 0}.field input,.field select{display:block;width:100%;margin-top:9px;padding:11px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px}.field input[type=color]{height:44px;padding:5px}.hint{font-size:12px;line-height:1.7;color:var(--muted)}.stack{display:grid;gap:9px}.badge{color:var(--muted);font-size:12px}.left #add{width:100%;margin-bottom:20px}@media(max-width:1100px){.workspace{grid-template-columns:65px 170px minmax(0,1fr)}.right{display:none}.stage{padding:18px}}@media(max-width:650px){.workspace{grid-template-columns:1fr}.rail,.left{display:none}.logo{width:125px}.logo img{width:120px}.top input{width:100px}.top{padding:0 10px;gap:5px}.stage{padding:10px}.toolbar{padding:8px}}</style></head><body>
<header class="top"><div class="logo"><img id="brandLogo" src="assets/qards-dark.svg" alt="Qards"></div><input id="deckName" aria-label="Presentation name" value="Untitled presentation"><span class="badge" id="saveState">Ready</span><span class="grow"></span><button id="theme" title="Toggle light or dark theme">☀ / ☾</button><button id="present" class="primary">▷ Present</button></header>
<div class="workspace"><aside class="rail" aria-label="Navigation"><button class="active"><span class="symbol">▣</span>Slides</button><button disabled><span class="symbol">▦</span>Templates</button><button disabled><span class="symbol">◇</span>Elements</button><button disabled><span class="symbol">▧</span>Media</button><button disabled><span class="symbol">◈</span>Brand</button></aside><aside class="left"><div class="section">Your qards</div><div id="thumbs"></div><button id="add" style="width:100%">+ New qard</button></aside>
<main class="editor"><div class="toolbar"><button id="undo">↶ Undo</button><button id="redo">↷ Redo</button><button id="duplicate">Duplicate</button><button id="remove">Delete</button><span class="grow"></span><button id="export">Export JSON</button><button id="import">Import JSON</button><input id="file" type="file" accept="application/json,.json" hidden></div>
<div class="stage"><article class="slide" id="slide"><h1 id="heading" contenteditable="true" spellcheck="true"></h1><p id="subtitle" contenteditable="true" spellcheck="true"></p></article></div><div class="footer"><span id="count"></span><span>Qards Studio · v0.1.1</span></div></main>
<aside class="right"><div class="section">Qard settings</div><label class="field">Layout<select id="layout"><option value="title">Title and subtitle</option><option value="center">Centered statement</option><option value="minimal">Minimal</option></select></label><label class="field">Background colour<input type="color" id="background" value="#f8f9fd"></label><label class="field">Text colour<input type="color" id="foreground" value="#222b3b"></label><div class="section">Workspace</div><div class="stack"><button id="save">Save locally</button><button id="reset">New presentation</button></div><p class="hint">Edit text directly on the qard. Your work is automatically saved in this browser. Export JSON for a portable editable backup.</p></aside></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),key='qards-v01',themeKey='qards-theme';
const fresh=()=>({name:'Untitled presentation',slides:[{title:'Ideas deserve a beautiful stage.',subtitle:'Click to edit. Make every qard count.',layout:'title',bg:'#f8f9fd',fg:'#222b3b'}],active:0});
let doc=fresh(),past=[],future=[],timer;
try{const saved=JSON.parse(localStorage.getItem(key));if(valid(saved))doc=saved}catch(e){}
function valid(d){return !!(d&&typeof d.name==='string'&&Array.isArray(d.slides)&&d.slides.length&&d.slides.length<501&&d.slides.every(s=>typeof s.title==='string'&&typeof s.subtitle==='string'&&['title','center','minimal'].includes(s.layout)&&/^#[0-9a-f]{6}$/i.test(s.bg)&&/^#[0-9a-f]{6}$/i.test(s.fg)))}
function snapshot(){return JSON.stringify(doc)}
function record(){past.push(snapshot());if(past.length>80)past.shift();future=[]}
function persist(){try{localStorage.setItem(key,snapshot());$('saveState').textContent='Saved'}catch(e){$('saveState').textContent='Storage unavailable'}}
function mutate(fn){record();fn();render();persist()}
function render(){doc.active=Math.max(0,Math.min(doc.active,doc.slides.length-1));const s=doc.slides[doc.active];$('deckName').value=doc.name;$('heading').textContent=s.title;$('subtitle').textContent=s.subtitle;$('slide').style.background=s.bg;$('slide').style.color=s.fg;$('subtitle').style.color=s.fg;$('slide').style.alignItems=s.layout==='center'?'center':'stretch';$('slide').style.textAlign=s.layout==='center'?'center':'left';$('subtitle').style.display=s.layout==='minimal'?'none':'block';$('layout').value=s.layout;$('background').value=s.bg;$('foreground').value=s.fg;$('count').textContent='Qard '+(doc.active+1)+' of '+doc.slides.length;$('thumbs').replaceChildren(...doc.slides.map((s,i)=>{const b=document.createElement('button');b.className='thumb'+(i===doc.active?' active':'');const a=document.createElement('span'),c=document.createElement('small');a.textContent=(i+1)+'. '+(s.title||'Untitled qard');c.textContent=s.subtitle;b.append(a,c);b.onclick=()=>{doc.active=i;render();persist()};return b}))}
function editText(){const s=doc.slides[doc.active],t=$('heading').innerText,u=$('subtitle').innerText;if(s.title===t&&s.subtitle===u)return;record();s.title=t;s.subtitle=u;clearTimeout(timer);timer=setTimeout(persist,250)}
$('heading').addEventListener('input',editText);$('subtitle').addEventListener('input',editText);
$('deckName').addEventListener('change',e=>mutate(()=>doc.name=e.target.value.trim()||'Untitled presentation'));
$('add').onclick=()=>mutate(()=>{doc.slides.splice(doc.active+1,0,{title:'New qard',subtitle:'Your story starts here.',layout:'title',bg:'#f8f9fd',fg:'#222b3b'});doc.active++});
$('duplicate').onclick=()=>mutate(()=>{doc.slides.splice(doc.active+1,0,{...doc.slides[doc.active]});doc.active++});
$('remove').onclick=()=>{if(doc.slides.length===1)return alert('A presentation needs at least one qard.');mutate(()=>doc.slides.splice(doc.active,1))};
$('layout').onchange=e=>mutate(()=>doc.slides[doc.active].layout=e.target.value);
$('background').oninput=e=>mutate(()=>doc.slides[doc.active].bg=e.target.value);
$('foreground').oninput=e=>mutate(()=>doc.slides[doc.active].fg=e.target.value);
$('undo').onclick=()=>{if(!past.length)return;future.push(snapshot());doc=JSON.parse(past.pop());render();persist()};
$('redo').onclick=()=>{if(!future.length)return;past.push(snapshot());doc=JSON.parse(future.pop());render();persist()};
$('save').onclick=persist;
$('reset').onclick=()=>{if(confirm('Create a new presentation? Export a backup first if needed.'))mutate(()=>{doc=fresh()})};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'qards',version:1,...doc},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(doc.name.replace(/[^a-z0-9-_ ]/gi,'').trim()||'presentation')+'.qards.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('File too large');const data=JSON.parse(await f.text());if(!valid(data))throw Error('Invalid Qards file');mutate(()=>{doc={name:data.name,slides:data.slides,active:Number.isInteger(data.active)?data.active:0}})}catch(err){alert('Could not import: '+err.message)}e.target.value=''};
function theme(v){document.body.classList.toggle('light',v==='light');$('brandLogo').src=v==='light'?'assets/qards-light.svg':'assets/qards-dark.svg';localStorage.setItem(themeKey,v)}
theme(localStorage.getItem(themeKey)==='light'?'light':'dark');$('theme').onclick=()=>theme(document.body.classList.contains('light')?'dark':'light');
$('present').onclick=()=>{const el=$('slide');if(document.fullscreenElement)document.exitFullscreen();else el.requestFullscreen?.()};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.target.isContentEditable){e.preventDefault();(e.shiftKey?$('redo'):$('undo')).click()}});
render();persist();
})();
</script></body></html>
